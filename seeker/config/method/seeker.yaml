name: seeker
focus:
  source:
    name: seeker
    weights: .weights/seeker_mimicgen_v1.0.pth
    strict_weights: true
    checkpoint_views: [agentview, eye_in_hand]
  profiles:
    default:
      views:
        agentview: focus_crop
        eye_in_hand: pass_through
      overlay: {}
    background:
      views:
        agentview: focus_mask_crop
        eye_in_hand: focus_mask
      overlay:
        guided:
          prob: 0.5
          noise_std: 0.05
          alpha_min: 0.3
          alpha_max: 0.8
          warmup_steps: 2500
          background_path: datasets/backgrounds
    dr_only:
      views:
        agentview: focus_crop
        eye_in_hand: pass_through
      overlay: {}
mirror_augmentation:
  enable: false
